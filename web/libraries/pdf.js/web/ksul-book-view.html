<html dir="ltr" mozdisallowselectionprint>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="google" content="notranslate">
  <title>PDF.js viewer</title>

  <link rel="stylesheet" media="all" href="https://pro.fontawesome.com/releases/v5.7.2/css/all.css" />

  <link rel="stylesheet" href="ksul_viewer.css">


  <!-- This snippet is used in production (included from viewer.html) -->
  <link rel="resource" type="application/l10n" href="locale/locale.properties">
  <script src="/core/assets/vendor/jquery/jquery.min.js?v3.7.1"></script>
  <script src="../build/pdf.js"></script>

</head>

<body>
  <div id="pdf-controls">
    <label for="current-page">Go to Page:</label>
    <input type="number" id="current-page" value="1" min="1" width="1">
    <button id="first-page">First Page</button>
    <button id="prev-page">Prev</button>
    <span id="page-num">Page </span> of
    <span id="page-count"></span>
    <button id="next-page">Next</button>
    <button id="last-page">Last Page</button>
    <button id="zoom-in">Zoom In +</button>
    <button id="zoom-out">Zoom Out -</button>
  </div>

  <div id="loading-indicator" style="display: none;">
    <div>Loading PDF: <span id="loading-percentage">0%</span></div>
    <progress id="pdf-load-progress" value="0" max="100"></progress>
  </div>

  <div id="pdf-viewer-container">
    <canvas id="pdf-canvas-left"></canvas>
    <canvas id="pdf-canvas-right"></canvas>
  </div>


  <script src="ksul_viewer.js"></script>
</body>

</html>
