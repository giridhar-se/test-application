id: node.islandora_object.field_ksul_related_to
field_name: field_ksul_related_to
entity_type: node
bundle: islandora_object
label: 'Related To'
description: "Related To is a field created by KSUL and contains information that identifies other resources related to the one being described (ex. finding aid, related resource not in the same collection).\r\nWhile Related To (text) and Related To (URI) are separate fields in the metadata spreadsheet, they are mapped to the same field in Islandora. The URI is the link or linked data identifier that links out to the related resource. The text is the human-readable text that will be hyperlinked with the URI.\r\nExample:\r\nRelated To (text) - Frank Caldwell Hershberger Papers Finding Aid\r\nRelated To (URI) - https://findingaids.lib.k-state.edu/frank-caldwell-hershberger-papers\r\nWhat shows in Islandora: Frank Caldwell Hershberger Papers Finding Aid\r\n\r\n<a href=\"https://staffnet.lib.k-state.edu/display/IS/Important+Metadata+Fields+in+Islandora\">Important Metadata Fields in Islandora</a>"
required: false
