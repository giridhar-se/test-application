description: "The KSUL Note field is a field created by KSUL and contains information that is helpful for metadata creators and editors. This field contains more detailed information about the object/record than the general Note field, and is intended to contain information that is used from a back-end perspective. The KSUL Notes field can contain a variety of information such as:\r\nInformation for KSUL workers regarding redactions/additions/modifications of a record/item that aids in the continued use and preservation of the record\r\nInformation about embargo dates\r\n\r\n<a href=\"https://staffnet.lib.k-state.edu/display/IS/Important+Metadata+Fields+in+Islandora\"> Islandora Metadata</a>"
