label: 'Publication Link'
description: "A URL (preferably a permalink) that directs the user to the digitally published work.\r\nWhile Publication Link (URL) and Publication Link (URL) are separate fields in the metadata spreadsheet, they are mapped to the same field in Islandora. The URL is the link or linked data identifier that links out to the related resource. The text is the human-readable text that will be hyperlinked with the URI.\r\nIf using this field, Publication Link (link text) is not required. Including the URL only will automatically make the URL the link text as well.\r\n<a href=\"https://staffnet.lib.k-state.edu/display/IS/Important+Metadata+Fields+in+Islandora\">Islandora Metadata Notes</a>"
